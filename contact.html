<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card {
            display: flex;
            width: 750px;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 25px 60px rgba(0,0,0,0.5);
        }

        .left {
            background: linear-gradient(180deg, #1a73e8, #0d47a1);
            color: white;
            padding: 50px 35px;
            width: 40%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 20px;
        }

        .left h2 { font-size: 1.8rem; font-weight: 700; }
        .left p  { font-size: 0.9rem; opacity: 0.85; line-height: 1.7; }

        .info-item {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 0.88rem;
            opacity: 0.9;
        }

        .icon {
            width: 36px;
            height: 36px;
            background: rgba(255,255,255,0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            flex-shrink: 0;
        }

        .right {
            background: #fff;
            padding: 50px 40px;
            width: 60%;
        }

        .right h1 { color: #1a73e8; font-size: 1.8rem; margin-bottom: 8px; }
        .right .subtitle { color: #888; font-size: 0.88rem; margin-bottom: 28px; }

        .row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }

        .form-group { margin-bottom: 18px; }

        label {
            display: block;
            font-size: 0.82rem;
            font-weight: 600;
            color: #444;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input, textarea, select {
            width: 100%;
            padding: 11px 14px;
            border: 2px solid #e8e8e8;
            border-radius: 10px;
            font-size: 0.9rem;
            color: #333;
            outline: none;
            transition: all 0.3s;
            font-family: inherit;
            background: #fafafa;
        }

        input:focus, textarea:focus, select:focus {
            border-color: #1a73e8;
            background: white;
            box-shadow: 0 0 0 3px rgba(26,115,232,0.1);
        }

        textarea { resize: vertical; min-height: 110px; }

        button {
            width: 100%;
            padding: 13px;
            background: linear-gradient(135deg, #1a73e8, #0d47a1);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            letter-spacing: 0.5px;
            margin-top: 5px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(26,115,232,0.4);
        }

        .note { text-align: center; color: #bbb; font-size: 0.78rem; margin-top: 14px; }
    </style>
</head>
<body>
    <div class="card">
        <div class="left">
            <h2>Get In Touch 👋</h2>
            <p>Have a question or need support? Fill out the form and our team will get back to you shortly.</p>
            <div class="info-item">
                <div class="icon">📧</div>
                <span>support@retailsystem.com</span>
            </div>
            <div class="info-item">
                <div class="icon">📞</div>
                <span>+61 400 000 000</span>
            </div>
            <div class="info-item">
                <div class="icon">📍</div>
                <span>Sydney, Australia</span>
            </div>
            <div class="info-item">
                <div class="icon">🕐</div>
                <span>Mon - Fri: 9am - 5pm</span>
            </div>
        </div>

        <div class="right">
            <h1>Contact Us</h1>
            <p class="subtitle">We typically respond within 24 hours.</p>
            <form>
                <div class="row">
                    <div class="form-group">
                        <label>First Name</label>
                        <input type="text" placeholder="John">
                    </div>
                    <div class="form-group">
                        <label>Last Name</label>
                        <input type="text" placeholder="Doe">
                    </div>
                </div>
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" placeholder="john@example.com">
                </div>
                <div class="form-group">
                    <label>Subject</label>
                    <select>
                        <option value="">Select a subject...</option>
                        <option>General Enquiry</option>
                        <option>Technical Support</option>
                        <option>Billing</option>
                        <option>Feedback</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Message</label>
                    <textarea placeholder="Write your message here..."></textarea>
                </div>
                <button type="submit">🚀 Send Message</button>
                <p class="note">🔒 Your information is safe with us.</p>
            </form>
        </div>
    </div>
</body>
</html>
